name: frontend-build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install (workspace root)
        run: npm ci
      - name: Build root package
        run: npm run build
      - name: Root tests
        run: npm test
      - name: Frontend tests
        working-directory: frontend
        run: npm run test
      - name: Next.js build
        working-directory: frontend
        run: npx next build
      # E2e runs against the dev server (playwright webServer) with no
      # database configured — the specs assert the honest degradation paths
      # (AC-J2.3/J2.6) plus the wallet-session flow with a mocked connector.
      # DB-backed flows need a provisioned database branch and are a
      # separate, future CI gate.
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        working-directory: frontend
        run: npx playwright test
        env:
          CI: "true"
