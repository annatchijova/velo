<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: 'Courier New', Consolas, monospace; }
    </style>
    <pattern id="diag" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#3A3F4B"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#4A4F5E" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#EDE7DA"/>

  <!-- header -->
  <text x="80" y="90" class="mono" font-size="15" letter-spacing="2" fill="#8B3A2F">DESIGN PRINCIPLE</text>
  <text x="80" y="140" class="serif" font-size="34" font-weight="600" fill="#1C1A17">Two ledgers, one boundary</text>
  <text x="80" y="172" class="serif" font-style="italic" font-size="17" fill="#3A3F4B">Nothing crosses unless the contract author marks it explicitly</text>

  <!-- PUBLIC ZONE -->
  <rect x="80" y="220" width="660" height="560" fill="#EDE7DA" stroke="#3A3F4B" stroke-width="2"/>
  <text x="112" y="266" class="mono" font-size="12" letter-spacing="1.5" fill="#8B3A2F">PUBLIC — ON-CHAIN LEDGER</text>
  <text x="112" y="302" class="serif" font-size="24" font-weight="600" fill="#1C1A17">What gets published</text>
  <text x="112" y="328" class="serif" font-style="italic" font-size="14" fill="#3A3F4B">Anyone, forever, immutable.</text>

  <g class="mono" font-size="15" fill="#1C1A17">
    <line x1="112" y1="356" x2="708" y2="356" stroke="#C9C4B8"/>
    <text x="112" y="386">commitment</text>
    <line x1="112" y1="404" x2="708" y2="404" stroke="#C9C4B8"/>
    <text x="112" y="434">declared verdict</text>
    <line x1="112" y1="452" x2="708" y2="452" stroke="#C9C4B8"/>
    <text x="112" y="482">attestation_count</text>
    <line x1="112" y1="500" x2="708" y2="500" stroke="#C9C4B8"/>
    <text x="112" y="530">case_commitment</text>
    <line x1="112" y1="548" x2="708" y2="548" stroke="#C9C4B8"/>
  </g>

  <line x1="112" y1="640" x2="708" y2="640" stroke="#3A3F4B" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="112" y="666" class="mono" font-size="10.5" letter-spacing="1.5" fill="#9C978A">PROVES</text>
  <text x="112" y="696" class="sans" font-size="14.5" fill="#3A3F4B">That an attestation exists and</text>
  <text x="112" y="716" class="sans" font-size="14.5" fill="#3A3F4B">follows the rules.</text>

  <!-- BOUNDARY -->
  <rect x="740" y="220" width="120" height="560" fill="#E4DDCC" stroke="#3A3F4B" stroke-width="2"/>
  <rect x="770" y="420" width="60" height="160" fill="#8B3A2F"/>
  <text x="800" y="500" class="mono" font-size="16" fill="#EDE7DA" text-anchor="middle" transform="rotate(-90 800 500)">disclose()</text>

  <!-- PRIVATE ZONE -->
  <rect x="860" y="220" width="660" height="560" fill="url(#diag)"/>
  <rect x="860" y="220" width="660" height="560" fill="#3A3F4B" fill-opacity="0.55"/>
  <rect x="860" y="220" width="660" height="560" fill="none" stroke="#3A3F4B" stroke-width="2"/>

  <text x="892" y="266" class="mono" font-size="12" letter-spacing="1.5" fill="#C9C4B8">PRIVATE — WITNESS, EXPERT'S MACHINE ONLY</text>
  <text x="892" y="302" class="serif" font-size="24" font-weight="600" fill="#EDE7DA">What never leaves</text>
  <text x="892" y="328" class="serif" font-style="italic" font-size="14" fill="#C9C4B8">Nobody but the expert, never leaves the machine.</text>

  <g class="mono" font-size="15" fill="#EDE7DA" font-style="italic">
    <line x1="892" y1="356" x2="1488" y2="356" stroke="#5A5F6E"/>
    <text x="892" y="386">bundle_fingerprint</text>
    <line x1="892" y1="404" x2="1488" y2="404" stroke="#5A5F6E"/>
    <text x="892" y="434">custody_tip</text>
    <line x1="892" y1="452" x2="1488" y2="452" stroke="#5A5F6E"/>
    <text x="892" y="482">verdict detail</text>
    <line x1="892" y1="500" x2="1488" y2="500" stroke="#5A5F6E"/>
    <text x="892" y="530">corroboration_count</text>
    <line x1="892" y1="548" x2="1488" y2="548" stroke="#5A5F6E"/>
    <text x="892" y="578">secret_salt</text>
    <line x1="892" y1="596" x2="1488" y2="596" stroke="#5A5F6E"/>
  </g>

  <line x1="892" y1="640" x2="1488" y2="640" stroke="#C9C4B8" stroke-width="1" stroke-dasharray="3 4" opacity="0.4"/>
  <text x="892" y="666" class="mono" font-size="10.5" letter-spacing="1.5" fill="#9C978A">PROVES</text>
  <text x="892" y="696" class="sans" font-size="14.5" fill="#C9C4B8">Nothing directly — it is the</text>
  <text x="892" y="716" class="sans" font-size="14.5" fill="#C9C4B8">input to a ZK proof.</text>

  <!-- footer -->
  <text x="80" y="850" class="mono" font-size="11" fill="#9C978A" letter-spacing="1">VELO · based on docs/ARCHITECTURE.md</text>
</svg>
